name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install ezdxf pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon=icon.ico --name DxfContourFixer dxf_contour_fixer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DxfContourFixer-exe
          path: dist/DxfContourFixer.exe
